<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury 3-Story House &amp; Garden — Interactive 3D Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Three.js r160 ES Module Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    /* =========================================================================
       BASE LAYOUT & FULL-VIEWPORT CANVAS
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0c1118;
      color: #f4f1ea;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    #scene-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      outline: none;
    }

    #scene-canvas.dragging {
      cursor: grabbing;
    }

    #scene-canvas.pointer-locked {
      cursor: none;
    }

    /* =========================================================================
       LOADING SCREEN
       ========================================================================= */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #0b0e14;
      transition: opacity 0.65s ease, visibility 0.65s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 200, 120, 0.18);
      border-top-color: #f3b559;
      animation: spin 0.95s linear infinite;
    }

    .loader-text {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(246, 238, 224, 0.82);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* =========================================================================
       TOP LOCATION BADGE & CROSSHAIR
       ========================================================================= */
    #location-badge {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(15, 18, 24, 0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 230, 190, 0.16);
      font-size: 12.5px;
      font-weight: 500;
      color: #f8efe2;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }

    .loc-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #53d690;
      box-shadow: 0 0 10px rgba(83, 214, 144, 0.75);
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 246, 230, 0.7);
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.75);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 25;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #crosshair.visible {
      opacity: 1;
    }

    /* =========================================================================
       INTERACTIVE DOOR PROMPT ([E] OPEN / CLOSE)
       ========================================================================= */
    #door-prompt {
      position: fixed;
      bottom: 92px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      z-index: 35;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 14px;
      background: rgba(18, 22, 30, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(246, 192, 104, 0.45);
      color: #fff6e8;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.48);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #door-prompt.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .prompt-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: linear-gradient(135deg, #e59a38, #c4741d);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 0 3px 10px rgba(229, 154, 56, 0.45);
    }

    /* =========================================================================
       BOTTOM GLASSMORPHIC CONTROLS HUD
       ========================================================================= */
    #hud-bar {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      z-index: 30;
      width: min(980px, calc(100vw - 24px));
      padding: 10px 15px;
      border-radius: 16px;
      background: rgba(14, 17, 23, 0.68);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 228, 186, 0.16);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.48);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #hud-bar.hud-hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      pointer-events: none;
    }

    .hud-hints {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 12px;
      color: rgba(244, 238, 228, 0.84);
    }

    .hint-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 240, 215, 0.12);
      border: 1px solid rgba(255, 220, 168, 0.24);
      color: #fae5c2;
      font-size: 11px;
      font-weight: 500;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 228, 188, 0.18);
      background: rgba(255, 245, 230, 0.08);
      color: #f7f1e6;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
    }

    .ctrl-btn:hover {
      background: rgba(255, 236, 206, 0.16);
      border-color: rgba(245, 190, 102, 0.42);
    }

    .ctrl-btn:active {
      transform: scale(0.97);
    }

    .ctrl-btn.primary {
      background: linear-gradient(135deg, #de8b2d, #b86617);
      border-color: rgba(255, 214, 148, 0.45);
      color: #fffaf2;
    }

    .ctrl-btn.primary:hover {
      background: linear-gradient(135deg, #ec9b3d, #c97520);
    }

    .ctrl-btn.active-lock {
      background: rgba(226, 142, 48, 0.28);
      border-color: rgba(246, 192, 104, 0.68);
      color: #ffe8c2;
    }

    #hud-show-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 29;
      display: none;
      align-items: center;
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 228, 188, 0.2);
      background: rgba(14, 17, 23, 0.68);
      backdrop-filter: blur(14px);
      color: #f7e4c4;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    #hud-show-btn.visible {
      display: inline-flex;
    }

    /* =========================================================================
       TOAST NOTIFICATION (NO ALERT/CONFIRM)
       ========================================================================= */
    #toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      z-index: 50;
      padding: 10px 18px;
      border-radius: 12px;
      background: rgba(18, 22, 30, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(245, 190, 102, 0.35);
      color: #faf2e6;
      font-size: 12.5px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 760px) {
      #hud-bar {
        bottom: 10px;
        padding: 9px 11px;
      }
      .hud-hints {
        font-size: 11px;
        gap: 6px 9px;
      }
      .ctrl-btn {
        height: 31px;
        padding: 0 9px;
        font-size: 11.5px;
      }
    }
  </style>
</head>
<body>
  <div id="viewport">
    <canvas id="scene-canvas" tabindex="0"></canvas>
  </div>

  <!-- Top-Left Live Floor / Zone Indicator -->
  <div id="location-badge">
    <span class="loc-dot"></span>
    <span id="location-text">Front Garden</span>
  </div>

  <!-- Pointer-Lock Center Reticle -->
  <div id="crosshair" aria-hidden="true"></div>

  <!-- Dynamic Interactive Door Prompt -->
  <div id="door-prompt" aria-live="polite">
    <span class="prompt-key">E</span>
    <span id="door-prompt-text">Open Front Door</span>
  </div>

  <!-- Loader -->
  <div id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">Building 3-Story Villa &amp; Garden</div>
  </div>

  <!-- Toast Message -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Show Controls Pill -->
  <button id="hud-show-btn" type="button">Controls</button>

  <!-- Floating HUD -->
  <div id="hud-bar" aria-label="Explorer Controls">
    <div class="hud-hints">
      <span class="hint-item"><span class="kbd">↑ ↓ ← →</span> / <span class="kbd">WASD</span> Walk</span>
      <span class="hint-item"><span class="kbd">E</span> Open / Close Door</span>
      <span class="hint-item"><span class="kbd">Mouse Drag</span> / <span class="kbd">Lock</span> Look</span>
      <span class="hint-item"><span class="kbd">Shift</span> Run</span>
      <span class="hint-item"><span class="kbd">R</span> Reset</span>
    </div>

    <div class="hud-actions">
      <button id="lock-btn" class="ctrl-btn primary" type="button">
        <span id="lock-btn-text">Lock Mouse</span>
      </button>
      <button id="reset-btn" class="ctrl-btn" type="button">Reset</button>
      <button id="hud-hide-btn" class="ctrl-btn" type="button">Hide</button>
    </div>
  </div>

  <!-- =========================================================================
       THREE.JS 3-STORY HOUSE, FURNITURE, INTERACTIVE DOORS & TROPICAL GARDEN
       ========================================================================= -->
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    /* =========================================================================
       1. CONSTANTS, FLOOR LEVELS & PLAYER STATE
       ========================================================================= */
    const FLOOR1_Y = 0.20;
    const FLOOR2_Y = 4.00;
    const FLOOR3_Y = 7.80;
    const ROOF_Y   = 11.60;
    const EYE_HEIGHT = 1.66;

    const START_POS = new THREE.Vector3(0.0, EYE_HEIGHT, 16.5);
    const START_YAW = 0.0;
    const START_PITCH = 0.04;

    const player = {
      position: START_POS.clone(),
      feetY: 0.0,
      velocity: new THREE.Vector3(),
      yaw: START_YAW,
      pitch: START_PITCH,
      targetYaw: START_YAW,
      targetPitch: START_PITCH,
      fov: 52,
      targetFov: 52,
      keys: Object.create(null),
      isDragging: false,
      isPointerLocked: false,
      lastX: 0,
      lastY: 0,
      touchId: null,
      elapsed: 0,
      lastTs: 0
    };

    // Collision AABBs: { minX, maxX, minZ, maxZ, minY, maxY, doorRef? }
    const colliders = [];
    // Interactive Doors list
    const interactiveDoors = [];
    // Animated garden elements (water shader, swaying palms)
    const palmCrowns = [];
    let poolWaterMat = null;

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    function createSeededRandom(seed) {
      let s = seed >>> 0;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    function addCollider(minX, maxX, minZ, maxZ, minY, maxY, doorRef = null) {
      colliders.push({ minX, maxX, minZ, maxZ, minY, maxY, doorRef });
    }

    /* =========================================================================
       2. PROCEDURAL TEXTURES (ZERO EXTERNAL IMAGE URLS)
       ========================================================================= */
    function createGrassTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#3b6b33';
      ctx.fillRect(0, 0, 512, 512);
      const rand = createSeededRandom(11);
      for (let i = 0; i < 9000; i++) {
        const x = rand() * 512;
        const y = rand() * 512;
        const g = 88 + Math.floor(rand() * 54);
        const r = 42 + Math.floor(rand() * 34);
        const b = 32 + Math.floor(rand() * 24);
        ctx.fillStyle = `rgba(${r},${g},${b},0.45)`;
        ctx.fillRect(x, y, 2, 4 + rand() * 4);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(16, 16);
      return tex;
    }

    function createTileTexture(baseHex, groutHex, tilesPerSide = 4, repeat = 4) {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 512, 512);

      const step = 512 / tilesPerSide;
      const rand = createSeededRandom(29);
      for (let ty = 0; ty < tilesPerSide; ty++) {
        for (let tx = 0; tx < tilesPerSide; tx++) {
          const delta = (rand() - 0.5) * 12;
          ctx.fillStyle = delta > 0
            ? `rgba(255,255,255,${Math.abs(delta) / 255})`
            : `rgba(0,0,0,${Math.abs(delta) / 255})`;
          ctx.fillRect(tx * step + 2, ty * step + 2, step - 4, step - 4);
        }
      }
      ctx.strokeStyle = groutHex;
      ctx.lineWidth = 3;
      for (let i = 0; i <= tilesPerSide; i++) {
        const p = i * step;
        ctx.beginPath();
        ctx.moveTo(p, 0); ctx.lineTo(p, 512);
        ctx.moveTo(0, p); ctx.lineTo(512, p);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeat, repeat);
      return tex;
    }

    function createWoodTexture(baseColor = '#6f4528', grainColor = '#4a2b16') {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, 512, 512);

      const rand = createSeededRandom(55);
      for (let i = 0; i < 220; i++) {
        const y = rand() * 512;
        const h = 1 + rand() * 4;
        ctx.fillStyle = grainColor;
        ctx.globalAlpha = 0.14 + rand() * 0.2;
        ctx.fillRect(0, y, 512, h);
      }
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = '#2a160a';
      ctx.lineWidth = 2;
      for (let y = 0; y <= 512; y += 64) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(512, y);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

    function createPlasterTexture(hex = '#ece5d8') {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = hex;
      ctx.fillRect(0, 0, 256, 256);
      const rand = createSeededRandom(73);
      for (let i = 0; i < 900; i++) {
        ctx.fillStyle = rand() > 0.5 ? 'rgba(255,255,255,0.035)' : 'rgba(60,48,36,0.035)';
        ctx.beginPath();
        ctx.arc(rand() * 256, rand() * 256, 4 + rand() * 14, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 2);
      return tex;
    }

    /* =========================================================================
       3. RENDERER, SCENE, CAMERA & POST-PROCESSING
       ========================================================================= */
    const canvas = document.getElementById('scene-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ec4e8);
    scene.fog = new THREE.FogExp2(0xd9cdb9, 0.0085);

    const camera = new THREE.PerspectiveCamera(
      player.fov,
      window.innerWidth / window.innerHeight,
      0.1,
      220
    );
    camera.rotation.order = 'YXZ';

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.24,
      0.5,
      0.86
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
    });

    /* =========================================================================
       4. SHARED MATERIALS PALETTE
       ========================================================================= */
    const matGrass = new THREE.MeshStandardMaterial({ map: createGrassTexture(), roughness: 0.92 });
    const matExteriorWall = new THREE.MeshStandardMaterial({ map: createPlasterTexture('#efe7da'), roughness: 0.82 });
    const matInteriorWall = new THREE.MeshStandardMaterial({ map: createPlasterTexture('#f5f0e6'), roughness: 0.84 });
    const matAccentWall = new THREE.MeshStandardMaterial({ color: 0x3b4856, roughness: 0.78 });
    const matDarkTrim = new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 0.55, metalness: 0.25 });
    const matStonePath = new THREE.MeshStandardMaterial({ map: createTileTexture('#b8afa0', '#7e7568', 3, 6), roughness: 0.82 });
    const matMarbleFloor = new THREE.MeshStandardMaterial({ map: createTileTexture('#e9e2d5', '#c2b8a6', 4, 5), roughness: 0.28, metalness: 0.05 });
    const matWoodFloor = new THREE.MeshStandardMaterial({ map: createWoodTexture('#8c5d37', '#5d391e'), roughness: 0.52 });
    const matBathTile = new THREE.MeshStandardMaterial({ map: createTileTexture('#d7e2e4', '#9fb3b8', 6, 3), roughness: 0.35 });
    const matTeak = new THREE.MeshStandardMaterial({ map: createWoodTexture('#643c20', '#3d220f'), roughness: 0.55 });
    const matDoorWood = new THREE.MeshStandardMaterial({ map: createWoodTexture('#784826', '#4a2912'), roughness: 0.45 });
    const matBrass = new THREE.MeshStandardMaterial({ color: 0xd9a84c, roughness: 0.25, metalness: 0.85 });
    const matChrome = new THREE.MeshStandardMaterial({ color: 0xd8dfe6, roughness: 0.2, metalness: 0.88 });
    const matGlass = new THREE.MeshPhysicalMaterial({
      color: 0xd4ecff,
      transparent: true,
      opacity: 0.3,
      roughness: 0.08,
      metalness: 0.1,
      side: THREE.DoubleSide
    });
    const matFabricSofa = new THREE.MeshStandardMaterial({ color: 0xd8cfc2, roughness: 0.9 });
    const matFabricBlue = new THREE.MeshStandardMaterial({ color: 0x2f4d66, roughness: 0.88 });
    const matFabricTerracotta = new THREE.MeshStandardMaterial({ color: 0xb65d3b, roughness: 0.88 });
    const matWhiteGloss = new THREE.MeshStandardMaterial({ color: 0xf7f7f5, roughness: 0.22 });
    const matLampGlow = new THREE.MeshBasicMaterial({ color: 0xffe4ae });

    /* =========================================================================
       5. SKY DOME & GOLDEN-HOUR LIGHTING
       ========================================================================= */
    function buildSkyAndLighting() {
      const skyGeo = new THREE.SphereGeometry(140, 32, 20);
      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          uZenith: { value: new THREE.Color(0x2d68b8) },
          uHorizon: { value: new THREE.Color(0xf6c993) },
          uGround: { value: new THREE.Color(0x9ab08e) }
        },
        vertexShader: `
          varying vec3 vPos;
          void main() {
            vPos = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 uZenith;
          uniform vec3 uHorizon;
          uniform vec3 uGround;
          varying vec3 vPos;
          void main() {
            float h = normalize(vPos).y;
            vec3 col = h >= 0.0
              ? mix(uHorizon, uZenith, pow(clamp(h, 0.0, 1.0), 0.55))
              : mix(uHorizon, uGround, clamp(-h * 4.0, 0.0, 1.0));
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
      scene.add(new THREE.Mesh(skyGeo, skyMat));

      // Soft warm sky / grass bounce hemisphere light

    /* =========================================================================
       6. ARCHITECTURAL HELPERS (WALLS, WINDOWS, INTERACTIVE HINGED DOORS)
       ========================================================================= */
    function addWallBox(cx, cz, width, depth, baseY, height, mat, collide = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), mat);
      mesh.position.set(cx, baseY + height / 2, cz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      if (collide) {
        addCollider(
          cx - width / 2, cx + width / 2,
          cz - depth / 2, cz + depth / 2,
          baseY, baseY + height
        );
      }
      return mesh;
    }

    // Wall with a centered window cutout along X (constant Z)
    function addWindowWallX(x1, x2, z, baseY, height, thickness, mat, winW = 2.6, winBottom = 0.95, winTop = 2.75) {
      const totalW = x2 - x1;
      const cx = (x1 + x2) / 2;
      const sideW = (totalW - winW) / 2;

      if (sideW > 0.05) {
        addWallBox(x1 + sideW / 2, z, sideW, thickness, baseY, height, mat, true);
        addWallBox(x2 - sideW / 2, z, sideW, thickness, baseY, height, mat, true);
      }
      // Sill below window & lintel above window
      addWallBox(cx, z, winW, thickness, baseY, winBottom, mat, true);
      addWallBox(cx, z, winW, thickness, baseY + winTop, height - winTop, mat, false);

      // Glass pane & dark trim frame
      const winH = winTop - winBottom;
      const glass = new THREE.Mesh(new THREE.BoxGeometry(winW - 0.08, winH - 0.08, 0.04), matGlass);
      glass.position.set(cx, baseY + winBottom + winH / 2, z);
      scene.add(glass);

      // Window frame borders
      const frameThick = 0.07;
      const fTop = new THREE.Mesh(new THREE.BoxGeometry(winW, frameThick, thickness + 0.04), matDarkTrim);
      fTop.position.set(cx, baseY + winTop - frameThick / 2, z);
      scene.add(fTop);
      const fBot = new THREE.Mesh(new THREE.BoxGeometry(winW, frameThick, thickness + 0.04), matDarkTrim);
      fBot.position.set(cx, baseY + winBottom + frameThick / 2, z);
      scene.add(fBot);
    }

    // Wall with a centered window cutout along Z (constant X)
    function addWindowWallZ(z1, z2, x, baseY, height, thickness, mat, winW = 2.8, winBottom = 0.95, winTop = 2.75) {
      const totalW = z2 - z1;
      const cz = (z1 + z2) / 2;
      const sideW = (totalW - winW) / 2;

      if (sideW > 0.05) {
        addWallBox(x, z1 + sideW / 2, thickness, sideW, baseY, height, mat, true);
        addWallBox(x, z2 - sideW / 2, thickness, sideW, baseY, height, mat, true);
      }
      addWallBox(x, cz, thickness, winW, baseY, winBottom, mat, true);
      addWallBox(x, cz, thickness, winW, baseY + winTop, height - winTop, mat, false);

      const winH = winTop - winBottom;
      const glass = new THREE.Mesh(new THREE.BoxGeometry(0.04, winH - 0.08, winW - 0.08), matGlass);
      glass.position.set(x, baseY + winBottom + winH / 2, cz);
      scene.add(glass);
    }

    /**
     * Builds a wall segment with an interactive door opening and a hinged door panel.
     * axis: 'X' (wall runs along X, constant Z) or 'Z' (wall runs along Z, constant X)
     */
    function addDoorWall({
      axis, start, end, fixedCoord, doorCenter, baseY, wallHeight = 3.6,
      thickness = 0.24, doorWidth = 1.38, doorHeight = 2.38,
      wallMat = matInteriorWall, isGlassDoor = false, label = 'Door', swingDir = 1
    }) {
      const dStart = doorCenter - doorWidth / 2;
      const dEnd = doorCenter + doorWidth / 2;

      // Left, right, and top lintel wall segments
      if (axis === 'X') {
        if (dStart - start > 0.05) {
          addWallBox((start + dStart) / 2, fixedCoord, dStart - start, thickness, baseY, wallHeight, wallMat, true);
        }
        if (end - dEnd > 0.05) {
          addWallBox((dEnd + end) / 2, fixedCoord, end - dEnd, thickness, baseY, wallHeight, wallMat, true);
        }
        addWallBox(doorCenter, fixedCoord, doorWidth, thickness, baseY + doorHeight, wallHeight - doorHeight, wallMat, false);
      } else {
        if (dStart - start > 0.05) {
          addWallBox(fixedCoord, (start + dStart) / 2, thickness, dStart - start, baseY, wallHeight, wallMat, true);
        }
        if (end - dEnd > 0.05) {
          addWallBox(fixedCoord, (dEnd + end) / 2, thickness, end - dEnd, baseY, wallHeight, wallMat, true);
        }
        addWallBox(fixedCoord, doorCenter, thickness, doorWidth, baseY + doorHeight, wallHeight - doorHeight, wallMat, false);
      }

      // Door frame trim
      const frameGroup = new THREE.Group();
      const postGeo = new THREE.BoxGeometry(0.08, doorHeight, thickness + 0.06);
      const topGeo = new THREE.BoxGeometry(doorWidth + 0.14, 0.08, thickness + 0.06);
      const pL = new THREE.Mesh(postGeo, matTeak);
      pL.position.set(-doorWidth / 2, doorHeight / 2, 0);
      const pR = new THREE.Mesh(postGeo, matTeak);
      pR.position.set(doorWidth / 2, doorHeight / 2, 0);
      const pT = new THREE.Mesh(topGeo, matTeak);
      pT.position.set(0, doorHeight + 0.02, 0);
      frameGroup.add(pL, pR, pT);

      if (axis === 'X') {
        frameGroup.position.set(doorCenter, baseY, fixedCoord);
      } else {
        frameGroup.position.set(fixedCoord, baseY, doorCenter);
        frameGroup.rotation.y = Math.PI / 2;
      }
      scene.add(frameGroup);

      // Hinged Door Pivot
      const pivot = new THREE.Group();
      const panelW = doorWidth - 0.08;
      const panelH = doorHeight - 0.04;

      if (isGlassDoor) {
        // Modern timber-framed glass balcony door
        const frameOuter = new THREE.Mesh(new THREE.BoxGeometry(panelW, panelH, 0.06), matDarkTrim);
        frameOuter.position.set(panelW / 2, panelH / 2, 0);
        pivot.add(frameOuter);

        const glassInset = new THREE.Mesh(new THREE.BoxGeometry(panelW - 0.22, panelH - 0.24, 0.075), matGlass);
        glassInset.position.set(panelW / 2, panelH / 2, 0);
        pivot.add(glassInset);
      } else {
        // Solid carved teak door panel
        const panel = new THREE.Mesh(new THREE.BoxGeometry(panelW, panelH, 0.07), matDoorWood);
        panel.position.set(panelW / 2, panelH / 2, 0);
        panel.castShadow = true;
        panel.receiveShadow = true;
        pivot.add(panel);

        // Recessed decorative door molding
        const inset1 = new THREE.Mesh(new THREE.BoxGeometry(panelW * 0.68, panelH * 0.36, 0.082), matTeak);
        inset1.position.set(panelW / 2, panelH * 0.72, 0);
        pivot.add(inset1);
        const inset2 = new THREE.Mesh(new THREE.BoxGeometry(panelW * 0.68, panelH * 0.34, 0.082), matTeak);
        inset2.position.set(panelW / 2, panelH * 0.27, 0);
        pivot.add(inset2);
      }

      // Brass door handles on both sides
      for (const side of [-1, 1]) {
        const handle = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.03, 0.06), matBrass);
        handle.position.set(panelW - 0.14, 1.05, side * 0.06);
        pivot.add(handle);
      }

      const worldCenter = new THREE.Vector3();
      if (axis === 'X') {
        pivot.position.set(doorCenter - panelW / 2, baseY + 0.01, fixedCoord);
        worldCenter.set(doorCenter, baseY + 1.2, fixedCoord);
      } else {
        pivot.position.set(fixedCoord, baseY + 0.01, doorCenter + panelW / 2);
        pivot.rotation.y = Math.PI / 2;
        worldCenter.set(fixedCoord, baseY + 1.2, doorCenter);
      }
      scene.add(pivot);

      const baseRotY = pivot.rotation.y;
      const doorObj = {
        label,
        pivot,
        baseRotY,
        swingAngle: swingDir * (Math.PI * 0.52),
        isOpen: false,
        openAmount: 0,
        center: worldCenter
      };
      interactiveDoors.push(doorObj);

      // Dynamic door collider (active only while door is closed)
      if (axis === 'X') {
        addCollider(dStart, dEnd, fixedCoord - thickness / 2, fixedCoord + thickness / 2, baseY, baseY + doorHeight, doorObj);
      } else {
        addCollider(fixedCoord - thickness / 2, fixedCoord + thickness / 2, dStart, dEnd, baseY, baseY + doorHeight, doorObj);
      }
    }

    function addGlassRailing(x1, z1, x2, z2, baseY, height = 1.05, collide = true) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const len = Math.hypot(dx, dz);
      const cx = (x1 + x2) / 2;
      const cz = (z1 + z2) / 2;
      const angle = Math.atan2(dx, dz);

      const group = new THREE.Group();
      group.position.set(cx, baseY, cz);
      group.rotation.y = angle;

      const glass = new THREE.Mesh(new THREE.BoxGeometry(0.04, height - 0.08, len), matGlass);
      glass.position.y = height / 2;
      group.add(glass);

      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, len + 0.04), matTeak);
      rail.position.y = height;
      group.add(rail);

      const posts = Math.max(2, Math.round(len / 2.2) + 1);
      for (let i = 0; i < posts; i++) {
        const t = i / (posts - 1) - 0.5;
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.07, height, 0.07), matDarkTrim);
        post.position.set(0, height / 2, t * len);
        group.add(post);
      }
      scene.add(group);

      if (collide) {
        const pad = 0.09;
        addCollider(
          Math.min(x1, x2) - pad, Math.max(x1, x2) + pad,
          Math.min(z1, z2) - pad, Math.max(z1, z2) + pad,
          baseY, baseY + height
        );
      }
    }

    function buildStaircase(startY, endY) {
      const steps = 18;
      const zStart = 1.6;
      const zEnd = -5.6;
      const xCenter = 7.45;
      const stairW = 2.45;
      const dz = (zEnd - zStart) / steps;
      const dy = (endY - startY) / steps;

      for (let i = 0; i < steps; i++) {
        const y = startY + (i + 0.5) * dy;
        const z = zStart + (i + 0.5) * dz;
        const tread = new THREE.Mesh(new THREE.BoxGeometry(stairW, 0.09, Math.abs(dz) + 0.06), matTeak);
        tread.position.set(xCenter, y, z);
        tread.castShadow = true;
        tread.receiveShadow = true;
        scene.add(tread);
      }

      // Steel stringer spine underneath
      const runLen = Math.hypot(zEnd - zStart, endY - startY);
      const slopeAngle = Math.atan2(endY - startY, zStart - zEnd);
      const stringer = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, runLen), matDarkTrim);

      scene.add(handrail);
    }

    function addBoxFurniture(x, y, z, w, h, d, mat, collide = false, floorBaseY = 0) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y + h / 2, z);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      if (collide) {
        addCollider(x - w / 2, x + w / 2, z - d / 2, z + d / 2, floorBaseY, floorBaseY + h + 0.4);
      }
      return m;
    }

       9. BEAUTIFUL TROPICAL GARDEN (GEWATHTHA), POOL, GAZEBO & PALM TREES
       ========================================================================= */
    function createCoconutPalm(x, z, height = 7.5, lean = 0.08) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);

      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b513b, roughness: 0.9 });
      const segs = 7;
      for (let i = 0; i < segs; i++) {
        const segH = height / segs;
        const rBot = 0.24 - i * 0.018;
        const rTop = 0.22 - i * 0.018;
        const seg = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, segH + 0.08, 10), trunkMat);
        seg.position.set(Math.sin(i * 0.25) * lean * i, (i + 0.5) * segH, Math.cos(i * 0.25) * lean * i * 0.5);
        seg.castShadow = true;
        g.add(seg);
      }

      const crown = new THREE.Group();
      crown.position.set(Math.sin((segs - 1) * 0.25) * lean * (segs - 1), height, Math.cos((segs - 1) * 0.25) * lean * (segs - 1) * 0.5);
      const frondMat = new THREE.MeshStandardMaterial({ color: 0x2d6e30, roughness: 0.72, side: THREE.DoubleSide });

      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * Math.PI * 2;
        const frond = new THREE.Mesh(new THREE.ConeGeometry(0.45, 3.2, 5), frondMat);
        frond.scale.set(1.0, 1.0, 0.18);
        frond.rotation.z = Math.PI * 0.38;
        const holder = new THREE.Group();
        holder.rotation.y = a;
        frond.position.set(1.35, -0.15, 0);
        holder.add(frond);
        crown.add(holder);
      }

      // Coconuts cluster
      const nutMat = new THREE.MeshStandardMaterial({ color: 0x5d7a2d, roughness: 0.6 });
      for (let c = 0; c < 4; c++) {
        const a = (c / 4) * Math.PI * 2;
        const nut = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), nutMat);
        nut.position.set(Math.cos(a) * 0.22, -0.25, Math.sin(a) * 0.22);
        crown.add(nut);
      }

      g.add(crown);
      scene.add(g);
      palmCrowns.push({ mesh: crown, phase: x * 0.4 + z * 0.3 });
      addCollider(x - 0.32, x + 0.32, z - 0.32, z + 0.32, 0, height);
    }

    function createShadeTree(x, z, scale = 1.0) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.scale.setScalar(scale);

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.34, 2.8, 10),
        new THREE.MeshStandardMaterial({ color: 0x5c422c, roughness: 0.92 })
      );
      trunk.position.y = 1.4;
      trunk.castShadow = true;
      g.add(trunk);

      const leafColors = [0x2f6b2e, 0x3b7d34, 0x265c27];
      const blobs = [
        [0, 3.6, 0, 1.75],
        [-1.1, 3.1, 0.6, 1.25],
        [1.1, 3.2, -0.5, 1.3],
        [0.2, 3.0, 1.1, 1.15],
        [-0.4, 4.3, -0.3, 1.2]
      ];
      blobs.forEach(([bx, by, bz, br], idx) => {
        const canopy = new THREE.Mesh(
          new THREE.DodecahedronGeometry(br, 1),

        canopy.position.set(bx, by, bz);
        canopy.castShadow = true;
        g.add(canopy);
      });

      scene.add(g);
      addCollider(x - 0.38 * scale, x + 0.38 * scale, z - 0.38 * scale, z + 0.38 * scale, 0, 4 * scale);
    }

        st.position.set(sx, 0.025, 11.8);
        st.receiveShadow = true;
        scene.add(st);
      }

      // --- SWIMMING POOL & WOODEN SUN DECK (Left Side Yard) ---
      const poolDeck = new THREE.Mesh(new THREE.BoxGeometry(8.8, 0.14, 12.6), matWoodFloor);
      poolDeck.position.set(-15.5, 0.07, 2.5);
      poolDeck.receiveShadow = true;
      scene.add(poolDeck);

      const poolBorder = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.2, 9.8), matWhiteGloss);
      poolBorder.position.set(-15.5, 0.1, 2.5);
      scene.add(poolBorder);

      // Shimmering Animated Pool Water
      poolWaterMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uDeep: { value: new THREE.Color(0x0c7ca1) },
          uLight: { value: new THREE.Color(0x52d6e8) }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec3 uDeep;
          uniform vec3 uLight;
          varying vec2 vUv;
          void main() {
            float w1 = sin(vUv.x * 22.0 + uTime * 2.2) * cos(vUv.y * 18.0 - uTime * 1.6);
            float w2 = sin((vUv.x + vUv.y) * 28.0 - uTime * 2.8);
            float caustic = smoothstep(0.2, 0.9, (w1 + w2) * 0.5 + 0.5);
            vec3 col = mix(uDeep, uLight, caustic * 0.72);
            gl_FragColor = vec4(col, 0.94);
          }
        `,
        transparent: true
      });
      const poolWater = new THREE.Mesh(new THREE.PlaneGeometry(5.8, 9.2), poolWaterMat);
      poolWater.rotation.x = -Math.PI / 2;
      poolWater.position.set(-15.5, 0.21, 2.5);
      scene.add(poolWater);

      // Pool Sun Loungers
      for (const lz of [0.2, 3.8]) {
        addBoxFurniture(-19.2, 0.14, lz, 1.9, 0.28, 0.78, matWhiteGloss, true, 0);
        addBoxFurniture(-19.95, 0.42, lz, 0.45, 0.34, 0.72, matFabricTerracotta, false);
      }

      // --- TROPICAL GARDEN GAZEBO / AMBALAMA (Right Front Yard) ---
      const gx = 15.2, gz = 11.8;
      const gFloor = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.24, 4.8), matStonePath);
      gFloor.position.set(gx, 0.12, gz);
      gFloor.receiveShadow = true;
      scene.add(gFloor);

      for (const ox of [-2.1, 2.1]) {
        for (const oz of [-2.1, 2.1]) {
          const post = new THREE.Mesh(new THREE.BoxGeometry(0.24, 3.1, 0.24), matTeak);
          post.position.set(gx + ox, 1.75, gz + oz);
          post.castShadow = true;
          scene.add(post);
          addCollider(gx + ox - 0.18, gx + ox + 0.18, gz + oz - 0.18, gz + oz + 0.18, 0, 3.3);
        }
      }
      const gRoof = new THREE.Mesh(
        new THREE.ConeGeometry(3.85, 1.6, 4),
        new THREE.MeshStandardMaterial({ color: 0x8f4328, roughness: 0.78 })
      );
      gRoof.rotation.y = Math.PI / 4;
      gRoof.position.set(gx, 4.05, gz);
      gRoof.castShadow = true;
      scene.add(gRoof);

      // Gazebo Wooden Bench & Center Table
      addBoxFurniture(gx, 0.24, gz - 1.5, 2.6, 0.48, 0.65, matTeak, true, 0);
      addBoxFurniture(gx, 0.24, gz + 0.2, 1.2, 0.45, 0.75, matTeak, true, 0);

      // --- GARDEN BOLLARD PATHWAY LIGHTS ---
      for (const lz of [11.5, 15.5, 19.5, 23.0]) {
        for (const lx of [-2.2, 2.2]) {
          const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.75, 10), matDarkTrim);
          post.position.set(lx, 0.375, lz);
          scene.add(post);
          const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.14, 10), matLampGlow);
          cap.position.set(lx, 0.78, lz);
          scene.add(cap);
        }
      }

      // --- COCONUT PALMS, SHADE TREES & FLOWER BUSHES ---
      createCoconutPalm(-12.5, 15.5, 8.2, 0.12);
      createCoconutPalm(-20.5, 11.5, 7.6, -0.1);
      createCoconutPalm(12.2, 18.2, 8.6, 0.1);
      createCoconutPalm(20.5, 4.5, 8.0, -0.11);
      createCoconutPalm(-14.0, -11.5, 8.8, 0.09);
      createCoconutPalm(14.5, -12.0, 8.4, -0.08);

      createShadeTree(-21.5, -6.5, 1.35);
      createShadeTree(20.5, -5.0, 1.25);
      createShadeTree(19.5, 18.5, 1.2);
      createShadeTree(-6.5, -14.5, 1.3);
      createShadeTree(6.8, -14.5, 1.2);

      const flowerPalette = [0xe85d75, 0xf2b949, 0xf7f2eb, 0xd86ce0];
      const bushCoords = [
        [-3.2, 10.6], [-4.8, 10.6], [3.2, 10.6], [4.8, 10.6],
        [-7.5, 9.2], [7.5, 9.2], [-10.2, 16.5], [10.2, 16.5],
        [-2.8, 22.8], [2.8, 22.8], [-11.0, -8.5], [11.0, -8.5]
      ];
      bushCoords.forEach(([bx, bz], i) => {
        createFlowerBush(bx, bz, flowerPalette[i % flowerPalette.length]);
      });

      // --- PERIMETER ESTATE BOUNDARY WALL & FRONT GATE ---
      const wallH = 2.1;
      addWallBox(0, -18.5, 50, 0.45, 0, wallH, matExteriorWall, true);
      addWallBox(-25, 3.5, 0.45, 44.4, 0, wallH, matExteriorWall, true);
      addWallBox(25, 3.5, 0.45, 44.4, 0, wallH, matExteriorWall, true);
      // Front wall with open decorative gateway
      addWallBox(-14.0, 25.5, 22.4, 0.45, 0, wallH, matExteriorWall, true);
      addWallBox(14.0, 25.5, 22.4, 0.45, 0, wallH, matExteriorWall, true);
      // Gate pillars
      for (const gxPost of [-2.8, 2.8]) {
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.65, 2.7, 0.65), matStonePath);
        pillar.position.set(gxPost, 1.35, 25.5);
        pillar.castShadow = true;
        scene.add(pillar);
        const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), matLampGlow);
        lamp.position.set(gxPost, 2.84, 25.5);
        scene.add(lamp);
      }
    }

    /* =========================================================================
       10. FLOOR HEIGHT, STAIR NAVIGATION & COLLISION ENGINE
       ========================================================================= */
    function getTargetFeetY(x, z, currentFeetY) {
      // Outside house footprint
      const inHouse = Math.abs(x) <= 9.0 && Math.abs(z) <= 7.0;
      const onFrontPorch = Math.abs(x) <= 3.6 && z > 7.0 && z <= 9.8;
      const onF2Balcony = Math.abs(x) <= 5.6 && z > 7.0 && z <= 9.7;
      const onF3Terrace = Math.abs(x) <= 9.0 && z > 7.0 && z <= 10.1;

      if (!inHouse) {
        if (currentFeetY > 6.2 && onF3Terrace) return FLOOR3_Y;
        if (currentFeetY > 2.6 && currentFeetY <= 6.2 && onF2Balcony) return FLOOR2_Y;
        if (onFrontPorch) return 0.18;
        // Wooden pool deck elevation
        if (x >= -19.9 && x <= -11.1 && z >= -3.8 && z <= 8.8) return 0.14;
        // Gazebo elevation
        if (x >= 12.8 && x <= 17.6 && z >= 9.4 && z <= 14.2) return 0.24;
        return 0.0;
      }

      // Inside Stairwell Zone: x ∈ [6.05, 8.85], z ∈ [-5.7, 1.8]
      const inStairX = x >= 6.05 && x <= 8.85;
      const inStairZ = z >= -5.7 && z <= 1.8;

      if (inStairX && inStairZ) {
        const t = clamp((1.6 - z) / (1.6 - (-5.6)), 0, 1);
        const stair1Y = lerp(FLOOR1_Y, FLOOR2_Y, t);
        const stair2Y = lerp(FLOOR2_Y, FLOOR3_Y, t);

        // Choose whichever stair flight is closest to player's current elevation
        if (Math.abs(currentFeetY - stair2Y) < Math.abs(currentFeetY - stair1Y)) {
          return stair2Y;
        }
        return stair1Y;
      }

      // Standard flat floor slabs
      if (currentFeetY > 6.0) return FLOOR3_Y;
      if (currentFeetY > 2.3) return FLOOR2_Y;
      return FLOOR1_Y;
    }

    function resolveCollisions(pos, feetY) {
      // Keep inside garden perimeter
      pos.x = clamp(pos.x, -24.2, 24.2);
      pos.z = clamp(pos.z, -17.8, 24.6);

      const radius = 0.34;
      const pMinY = feetY + 0.18;
      const pMaxY = feetY + 1.65;

      // Two relaxation passes for clean corner sliding
      for (let pass = 0; pass < 2; pass++) {
        for (const c of colliders) {
          // Skip open doors!
          if (c.doorRef && c.doorRef.openAmount > 0.5) continue;

          // Only collide with objects on the same vertical level
          if (pMaxY < c.minY || pMinY > c.maxY) continue;

          const closestX = clamp(pos.x, c.minX, c.maxX);
          const closestZ = clamp(pos.z, c.minZ, c.maxZ);
          const dx = pos.x - closestX;
          const dz = pos.z - closestZ;
          const distSq = dx * dx + dz * dz;

          if (distSq < radius * radius) {
            if (distSq > 1e-6) {
              const dist = Math.sqrt(distSq);
              const push = radius - dist;
              pos.x += (dx / dist) * push;
              pos.z += (dz / dist) * push;
            } else {
              // Inside box fallback: push out along shallowest axis
              const dL = Math.abs(pos.x - c.minX);
              const dR = Math.abs(c.maxX - pos.x);
              const dB = Math.abs(pos.z - c.minZ);
              const dF = Math.abs(c.maxZ - pos.z);
              const m = Math.min(dL, dR, dB, dF);
              if (m === dL) pos.x = c.minX - radius;
              else if (m === dR) pos.x = c.maxX + radius;
              else if (m === dB) pos.z = c.minZ - radius;
              else pos.z = c.maxZ + radius;
            }
          }
        }
      }
    }

    /* =========================================================================
       11. DOOR INTERACTION (PRESS [E]) & LOCATION BADGE
       ========================================================================= */
    const doorPromptEl = document.getElementById('door-prompt');
    const doorPromptText = document.getElementById('door-prompt-text');
    const locationTextEl = document.getElementById('location-text');
    let nearestDoor = null;

    function findNearestDoor() {
      let best = null;
      let bestDist = 2.65;
      for (const d of interactiveDoors) {
        const dy = Math.abs((player.feetY + 1.2) - d.center.y);
        if (dy > 1.8) continue;
        const dist = Math.hypot(player.position.x - d.center.x, player.position.z - d.center.z);
        if (dist < bestDist) {
          bestDist = dist;
          best = d;
        }
      }
      return best;
    }

    function toggleNearestDoor() {
      if (!nearestDoor) return;
      nearestDoor.isOpen = !nearestDoor.isOpen;
    }

    function updateDoorsAndHUD(dt) {
      // Smoothly swing doors open/closed
      for (const d of interactiveDoors) {
        const target = d.isOpen ? 1.0 : 0.0;
        d.openAmount = lerp(d.openAmount, target, 1.0 - Math.exp(-8.5 * dt));
        d.pivot.rotation.y = d.baseRotY + d.swingAngle * d.openAmount;
      }

      nearestDoor = findNearestDoor();
      if (nearestDoor) {
        const action = nearestDoor.isOpen ? 'Close' : 'Open';
        doorPromptText.textContent = `${action} ${nearestDoor.label}`;
        doorPromptEl.classList.add('visible');
      } else {
        doorPromptEl.classList.remove('visible');
      }

      // Live zone / floor badge
      const x = player.position.x;
      const z = player.position.z;
      let zone = 'Tropical Garden';
      if (Math.abs(x) <= 9.2 && z >= -7.2 && z <= 10.2) {
        if (player.feetY >= 6.8) {
          zone = z > 7.0 ? '3rd Floor — Sky Terrace' : (x < -1.2 ? '3rd Floor — Cinema Lounge' : '3rd Floor');
        } else if (player.feetY >= 3.1) {
          zone = z > 7.0 ? '2nd Floor — Balcony' : (x < -1.2 ? '2nd Floor — Master Bedroom' : '2nd Floor');
        } else {
          zone = z > 7.0 ? 'Front Porch' : (x < -1.0 && z < -0.6 ? 'Ground Floor — Kitchen' : 'Ground Floor — Living & Dining');
        }
      } else if (x < -11.0 && z > -4.0 && z < 9.0) {
        zone = 'Garden — Swimming Pool';
      } else if (x > 12.0 && z > 8.5 && z < 15.0) {
        zone = 'Garden — Gazebo Pavilion';
      }
      locationTextEl.textContent = zone;
    }

    /* =========================================================================
       12. PLAYER MOVEMENT, MOUSE LOOK & UI EVENTS
       ========================================================================= */
    const forwardVec = new THREE.Vector3();
    const rightVec = new THREE.Vector3();
    const moveDir = new THREE.Vector3();

    function updatePlayer(dt) {
      const lookSmooth = 1.0 - Math.exp(-15.0 * dt);
      player.yaw = lerp(player.yaw, player.targetYaw, lookSmooth);
      player.pitch = lerp(player.pitch, player.targetPitch, lookSmooth);

      const fovSmooth = 1.0 - Math.exp(-10.0 * dt);
      player.fov = lerp(player.fov, player.targetFov, fovSmooth);
      if (Math.abs(camera.fov - player.fov) > 0.02) {
        camera.fov = player.fov;
        camera.updateProjectionMatrix();
      }

      forwardVec.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
      rightVec.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
      moveDir.set(0, 0, 0);

      const k = player.keys;
      if (k['ArrowUp'] || k['KeyW']) moveDir.add(forwardVec);
      if (k['ArrowDown'] || k['KeyS']) moveDir.sub(forwardVec);
      if (k['ArrowRight'] || k['KeyD']) moveDir.add(rightVec);
      if (k['ArrowLeft'] || k['KeyA']) moveDir.sub(rightVec);

      const maxSpeed = (k['ShiftLeft'] || k['ShiftRight']) ? 7.2 : 4.1;
      if (moveDir.lengthSq() > 0) moveDir.normalize().multiplyScalar(maxSpeed);

      const smooth = 1.0 - Math.exp(-(moveDir.lengthSq() > 0 ? 10.5 : 9.5) * dt);
      player.velocity.x = lerp(player.velocity.x, moveDir.x, smooth);
      player.velocity.z = lerp(player.velocity.z, moveDir.z, smooth);

      player.position.x += player.velocity.x * dt;
      player.position.z += player.velocity.z * dt;

      resolveCollisions(player.position, player.feetY);

      const targetFeet = getTargetFeetY(player.position.x, player.position.z, player.feetY);
      player.feetY = lerp(player.feetY, targetFeet, 1.0 - Math.exp(-11.0 * dt));
      player.position.y = player.feetY + EYE_HEIGHT;

      camera.position.copy(player.position);
      camera.rotation.y = player.yaw;
      camera.rotation.x = player.pitch;
      camera.rotation.z = 0;
    }

    function updateGardenAnimation(t) {
      if (poolWaterMat) poolWaterMat.uniforms.uTime.value = t;
      for (const p of palmCrowns) {
        p.mesh.rotation.z = Math.sin(t * 1.1 + p.phase) * 0.035;
        p.mesh.rotation.x = Math.cos(t * 0.85 + p.phase) * 0.025;
      }
    }

    // --- Event Listeners ---
    const hudBar = document.getElementById('hud-bar');
    const hudHideBtn = document.getElementById('hud-hide-btn');
    const hudShowBtn = document.getElementById('hud-show-btn');
    const lockBtn = document.getElementById('lock-btn');
    const lockBtnText = document.getElementById('lock-btn-text');
    const resetBtn = document.getElementById('reset-btn');
    const crosshair = document.getElementById('crosshair');
    const toastEl = document.getElementById('toast');

    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
    }

    function resetPosition() {
      player.position.copy(START_POS);
      player.feetY = 0.0;
      player.velocity.set(0, 0, 0);
      player.targetYaw = START_YAW;
      player.targetPitch = START_PITCH;
      player.targetFov = 52;
      showToast('Returned to Front Garden');
    }

    const PREVENT_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);

    window.addEventListener('keydown', (e) => {
      if (PREVENT_KEYS.has(e.code)) e.preventDefault();
      player.keys[e.code] = true;

      if (e.code === 'KeyE' && !e.repeat) {
        toggleNearestDoor();
      } else if (e.code === 'KeyR' && !e.repeat) {
        resetPosition();
      }
    });

    window.addEventListener('keyup', (e) => {
      player.keys[e.code] = false;
    });

    window.addEventListener('blur', () => {
      for (const k in player.keys) player.keys[k] = false;
      player.isDragging = false;
      canvas.classList.remove('dragging');
    });

    const MAX_PITCH = Math.PI * 0.44;

    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      canvas.focus();
      if (!player.isPointerLocked) {
        player.isDragging = true;
        player.lastX = e.clientX;
        player.lastY = e.clientY;
        canvas.classList.add('dragging');
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (player.isPointerLocked) {
        player.targetYaw -= e.movementX * 0.0022;
        player.targetPitch = clamp(player.targetPitch - e.movementY * 0.0022, -MAX_PITCH, MAX_PITCH);
      } else if (player.isDragging) {
        const dx = e.clientX - player.lastX;
        const dy = e.clientY - player.lastY;
        player.lastX = e.clientX;
        player.lastY = e.clientY;
        player.targetYaw -= dx * 0.0034;
        player.targetPitch = clamp(player.targetPitch - dy * 0.0034, -MAX_PITCH, MAX_PITCH);
      }
    });

    window.addEventListener('mouseup', () => {
      player.isDragging = false;
      canvas.classList.remove('dragging');
    });

    // Touch look support
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        player.touchId = e.touches[0].identifier;
        player.lastX = e.touches[0].clientX;
        player.lastY = e.touches[0].clientY;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      for (const t of e.touches) {
        if (t.identifier === player.touchId) {
          player.targetYaw -= (t.clientX - player.lastX) * 0.0045;
          player.targetPitch = clamp(player.targetPitch - (t.clientY - player.lastY) * 0.0045, -MAX_PITCH, MAX_PITCH);
          player.lastX = t.clientX;
          player.lastY = t.clientY;
          break;
        }
      }
    }, { passive: true });

    canvas.addEventListener('touchend', () => { player.touchId = null; }, { passive: true });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      player.targetFov = clamp(player.targetFov + e.deltaY * 0.022, 34, 68);
    }, { passive: false });

    document.addEventListener('pointerlockchange', () => {
      player.isPointerLocked = document.pointerLockElement === canvas;
      canvas.classList.toggle('pointer-locked', player.isPointerLocked);
      crosshair.classList.toggle('visible', player.isPointerLocked);
      lockBtn.classList.toggle('active-lock', player.isPointerLocked);
      lockBtnText.textContent = player.isPointerLocked ? 'ESC to Unlock' : 'Lock Mouse';
      if (player.isPointerLocked) showToast('Mouse Look Locked — Press ESC to unlock');
    });

    lockBtn.addEventListener('click', () => {
      if (player.isPointerLocked) {
        document.exitPointerLock();
      } else if (canvas.requestPointerLock) {
        try {
          const p = canvas.requestPointerLock();
          if (p && typeof p.catch === 'function') {
            p.catch(() => showToast('Use Click & Drag to look around'));
          }
        } catch {
          showToast('Use Click & Drag to look around');
        }
      }
    });

    resetBtn.addEventListener('click', () => { resetPosition(); canvas.focus(); });
    hudHideBtn.addEventListener('click', () => {
      hudBar.classList.add('hud-hidden');
      hudShowBtn.classList.add('visible');
      canvas.focus();
    });
    hudShowBtn.addEventListener('click', () => {
      hudBar.classList.remove('hud-hidden');
      hudShowBtn.classList.remove('visible');
    });

    /* =========================================================================
       13. INITIALIZE SCENE & MAIN ANIMATION LOOP
       ========================================================================= */
    function init() {
      try {
        buildSkyAndLighting();
        buildHouseStructure();
        buildAllFurniture();
        buildGarden();

        updatePlayer(0.016);
        updateDoorsAndHUD(0.016);
        composer.render();

        const loader = document.getElementById('loader');
        requestAnimationFrame(() => {
          loader.classList.add('hidden');
          canvas.focus();
        });

        player.lastTs = performance.now();
        requestAnimationFrame(animate);
      } catch (err) {
        console.error('House scene failed to initialize:', err);
        showToast('WebGL initialization error — please reload.');
      }
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - player.lastTs) / 1000, 0.05);
      player.lastTs = now;
      player.elapsed += dt;

      updatePlayer(dt);
      updateDoorsAndHUD(dt);
      updateGardenAnimation(player.elapsed);
      composer.render();
    }

    window.addEventListener('load', init);
  </script>
